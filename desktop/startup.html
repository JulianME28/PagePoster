<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self'"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PagePoster</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4f7fc;color:#17263d;font:15px/1.65 'Segoe UI',sans-serif;min-height:100vh;display:grid;place-items:center}.card{max-width:580px;width:calc(100% - 48px);padding:48px;border:1px solid #e0e7f2;border-radius:18px;background:white;box-shadow:0 12px 48px #263e6310}.logo{width:54px;height:54px;border-radius:14px;background:#2860ed;color:white;display:grid;place-items:center;font-size:33px;font-weight:700}.label{font-size:11px;letter-spacing:2px;color:#6b7f9c;margin-top:28px}h1{font-size:29px;line-height:1.3;margin:10px 0 16px}p{color:#667b98}button{font:600 14px 'Segoe UI';border:0;border-radius:8px;color:white;background:#285fed;padding:12px 20px;cursor:pointer}.dot{display:inline-block;width:8px;height:8px;background:#2f65ef;border-radius:50%;margin-right:8px;animation:pulse 1.2s infinite}@keyframes pulse{50%{opacity:.25}}[hidden]{display:none!important}</style><script defer src="startup.js"></script></head><body><main class="card"><div class="logo">P↗</div><div class="label">PAGEPOSTER DESKTOP</div><h1 id="title">Відкриваємо робоче місце</h1><p id="message"><span class="dot"></span>Підключаємо ваші проєкти, черги та захищені налаштування…</p><button id="restart" type="button" hidden>Перезапустити застосунок</button><p id="detail">Окремий запуск сервера або браузера не потрібен.</p></main></body></html>
